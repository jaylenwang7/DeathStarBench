global:
  nameOverride: ""
  fullnameOverride: ""
  mainChart: hotelres
  replicas: 1
  imagePullPolicy: "IfNotPresent"
  restartPolicy: Always
  serviceType: ClusterIP
  dockerRegistry: docker.io
  repository: jaylenwang
  imageName: hotel-reservation
  defaultImageVersion: test-v5
  serviceDnsDomain: "cluster.local"
  readinessProbe:
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 1
    timeoutSeconds: 2
    failureThreshold: 10
    successThreshold: 1
  services:
    environments:
      # TLS enablement
      #  - 0: Disable
      #  - 1: Enabled, using default cipher suite based on golang runtime
      #  - TLS_XXX: Enabled, using the specified Cipher suite, see tls/options.go#L22
      TLS: 0
      LOG_LEVEL: "INFO"
      JAEGER_SAMPLE_RATIO: "1.0"
      MEMC_TIMEOUT: "2"
      GC: "100"
      # MongoDB connection timeouts (in seconds)
      MONGO_SERVER_SELECTION_TIMEOUT: "5"
      MONGO_CONNECT_TIMEOUT: "10"
      MONGO_SOCKET_TIMEOUT: "30"
      MONGO_MAX_CONN_IDLE_TIME: "1800"
      # Timeout configurations (in milliseconds)
      GRPC_CONNECTION_TIMEOUT_MS: "5000"
      HTTP_READ_TIMEOUT_MS: "10000"
      HTTP_WRITE_TIMEOUT_MS: "10000"
      HTTP_IDLE_TIMEOUT_MS: "120000"
  affinity: {}
  tolerations: []
  nodeSelector: {}
  memcached:
    HACount: 1
    environments:
      MEMCACHED_CACHE_SIZE: "128"
      MEMCACHED_THREADS: "2"
  mongodb:
    persistentVolume:               # use hostPath or pvprovisioner
      enabled: false
      size: "1Gi"
      hostPath:
        enabled: false
        path: /tmp
      pvprovisioner:
        enabled: false
        storageClassName: ceph-fs   # optional
  lifecycle:
    preStop:
      exec:
        command: ["sh", "-c", "sleep 5"]