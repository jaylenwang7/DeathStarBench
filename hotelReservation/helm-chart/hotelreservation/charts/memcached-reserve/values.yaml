name: memcached-reserve

ports:
  - port: 11214
    targetPort: 11211
 
container:
  image:
    registry: ~
    repository: library
    name: memcached
    tag: 1.6.37
  name: hotel-reserv-reservation-mmc
  ports:
  - containerPort: 11211
  args:
    - "memcached"
    - "-c"
    - "4096"          # Increase max connections from default 1024
    - "-m"
    - "512"           # Memory limit
    - "-t"
    - "4"             # Increase threads